name: Fetch Market Indicators

on:
  schedule:
    # 毎月1日 00:00 JST = UTC 15:00（前日）
    - cron: '0 15 1 * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas yfinance requests beautifulsoup4 lxml openpyxl

      - name: Fetch indicators and upsert to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/market/fetch_indicators.py --fetch-only
